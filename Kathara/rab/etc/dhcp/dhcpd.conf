default-lease-time 300;
max-lease-time 300;

authoritative;

subnet 192.168.10.0 netmask 255.255.255.128 {
    range 192.168.10.3 192.168.10.125;
    option routers 192.168.10.126;
    option subnet-mask 255.255.255.128;
    option domain-name "bytza.izo";
    option domain-name-servers 192.168.10.1;
}

host ha1 {
    hardware ethernet 02:00:00:00:0A:01;
    fixed-address 192.168.10.1;
}

host ha2 {
    hardware ethernet 02:00:00:00:0A:02;
    fixed-address 192.168.10.2;
}
